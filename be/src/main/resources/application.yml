server:
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
  port: 8080
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # 기본값은 dev
    include: oauth, llm

  datasource:
    driver-class-name: ${DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: none # 공통은 안전하게 none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:local@example.com}
    password: ${MAIL_PASSWORD:local-dummy-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret-key: ${JWT_SECRET_KEY:phraiz-local-dev-jwt-secret-key-at-least-32-bytes}
  access-expire: ${JWT_ACCESS_EXPIRE:3600000}
  refresh-expire: ${JWT_REFRESH_EXPIRE:604800000}

openai:
  secret-key: ${GPT_API_KEY:dummy-local-key}
  model: gpt-4o
  api-url: https://api.openai.com/v1/chat/completions
  temperature:
    paraphrase: 0.3
    summary: 0.7
  max-tokens: 500

zotero:
  url: ${ZOTERO_URL:http://localhost:1969/web}

tosspayments:
  secret-key: ${TOSS_SECRET_KEY:test_sk_dummy_local_key}
